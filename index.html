<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VCR Stamp</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VCR Stamp">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  @font-face { font-family: "VCR"; src: url("fonts/VCR_OSD_MONO.woff") format("woff"); }
  :root { color-scheme: dark; --bg:#0b0b0f; --card:#17171d; --line:#2a2a33; --text:#f1f1f1; --dim:#9a9aa6; --accent:#ff3b30; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-family:"VCR", monospace; font-weight:normal; font-size:28px; margin:4px 0 2px; letter-spacing:1px; }
  h1 .rec { color:var(--accent); }
  .sub { color:var(--dim); margin:0 0 18px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label.pick { display:block; text-align:center; padding:18px; border:2px dashed var(--line); border-radius:12px; cursor:pointer; }
  label.pick b { display:block; font-size:17px; }
  label.pick span { color:var(--dim); font-size:13px; }
  input[type=file] { display:none; }
  .opts { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .opts label { font-size:13px; color:var(--dim); display:flex; flex-direction:column; gap:4px; }
  select, input[type=datetime-local] { font:inherit; color:var(--text); background:#101015; border:1px solid var(--line);
         border-radius:8px; padding:8px; width:100%; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; width:100%; font-size:17px; }
  button.secondary { background:#2a2a33; color:var(--text); }
  button:disabled { opacity:.45; cursor:default; }
  .file { border-top:1px solid var(--line); padding:12px 0; }
  .file:first-child { border-top:0; padding-top:0; }
  .file .name { font-weight:600; word-break:break-all; }
  .file .meta { color:var(--dim); font-size:13px; margin:2px 0 8px; }
  .bar { height:6px; background:#101015; border-radius:3px; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .status { font-size:13px; color:var(--dim); }
  .actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .actions > * { flex:1; text-align:center; }
  a.btn { text-decoration:none; background:#2a2a33; color:var(--text); border-radius:10px; padding:12px 14px; font-weight:600; }
  video { width:100%; border-radius:8px; margin-top:8px; background:#000; }
  .err { color:#ff8a80; }
  .note { color:var(--dim); font-size:12px; }
  #engine { font-size:13px; color:var(--dim); margin:-6px 0 14px; }
</style>
</head>
<body>
<main>
  <h1><span class="rec">●</span> VCR STAMP</h1>
  <p class="sub">Converts camcorder MPG/MTS clips to MP4 with a classic date/time stamp. Everything runs on this device; nothing is uploaded.</p>
  <div id="engine">Loading video engine…</div>

  <div class="card">
    <label class="pick" for="files">
      <b>Choose videos</b>
      <span>.MPG or .MTS from Files</span>
    </label>
    <input id="files" type="file" multiple accept=".mpg,.mpeg,.mts,.m2ts,.m2t,.mod,video/mpeg,video/mp2t,video/*">
  </div>

  <div class="card">
    <div class="opts">
      <label>Position
        <select id="position"><option value="left">Bottom left</option><option value="right">Bottom right</option></select>
      </label>
      <label>Show stamp
        <select id="span"><option value="0">Whole clip</option><option value="5">First 5 seconds</option></select>
      </label>
      <label>Seconds
        <select id="seconds"><option value="1">Show (1:41:40 PM)</option><option value="0">Hide (1:41 PM)</option></select>
      </label>
      <label>Quality
        <select id="quality"><option value="fast">Fast</option><option value="better">Better (slower)</option></select>
      </label>
    </div>
  </div>

  <div class="card" id="listCard" hidden>
    <div id="list"></div>
    <button class="primary" id="go" disabled>Convert</button>
    <p class="note">Keep this screen open while converting. Check each start time first. It's read from the camcorder's data when available.</p>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
